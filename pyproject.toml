[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Local-first desktop AI assistant backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
voice-local = [
    "faster-whisper>=1.1,<2",
    "onnxruntime>=1.20,<2",
]
voice-azure = ["azure-cognitiveservices-speech>=1.40,<2"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]
postgres = ["asyncpg>=0.29,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
files = ["apps/api/app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
